name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PYTHONUTF8: "1"

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Cache pip virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements/base.txt', 'backend/requirements/dev.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install Node dependencies
        run: npm ci

      - name: Run npm dependency audit
        run: python scripts/check_npm_audit.py

      - name: Build frontend
        run: |
          npm run frontend:build
          npm run frontend-v3:typecheck
          npm run frontend-v3:test
          npm run frontend-v3:build

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements/dev.txt

      - name: Run Python dependency audit
        run: .venv/bin/pip-audit -r backend/requirements/base.txt

      - name: Run pytest
        run: .venv/bin/python -m pytest tests/backend tests/integration tests/repository -q

      - name: Docs consistency check
        run: .venv/bin/python scripts/check_docs_consistency.py

  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Cache pip virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements/base.txt', 'backend/requirements/dev.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: |
          npm run frontend:test
          npm run frontend-v3:test

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements/dev.txt

      - name: Install Playwright browsers
        run: npm exec --workspace frontend-v3 -- playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          npm run frontend:e2e
          npm run frontend-v3:e2e
