name: Feature request
description: Propose a new capability or behavior change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need, workflow gap, or business goal does this address?
      placeholder: "Describe who is affected, what they are trying to do, and the current limitation."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and the smallest useful scope.
      placeholder: "Describe the smallest useful behavior, including important boundaries."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List other options, workarounds, or reasons they are not enough.
      placeholder: "List current workarounds or other options you considered."
  - type: textarea
    id: impact
    attributes:
      label: Impact and risks
      description: Mention affected users, modules, APIs, data, permissions, migration, or documentation.
      placeholder: "List affected users, modules, APIs, data, permissions, migration, or documentation."
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I can describe how this should be verified after implementation.
          required: true
