name: Documentation issue
description: Report missing, outdated, confusing, or inconsistent documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link or path to the affected documentation.
      placeholder: "docs/operations/setup.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Explain the gap, outdated statement, broken link, or unclear instruction.
      placeholder: "Describe the missing, outdated, conflicting, or unclear content."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documentation
      description: What should the document say or link to instead?
      placeholder: "Describe the corrected explanation, example, or link you expected."
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add related code paths, PRs, releases, screenshots, or user workflows.
      placeholder: "Add related code paths, pull requests, releases, screenshots, or workflows."
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I checked whether this is already covered by another document.
          required: true
        - label: I can identify the affected audience or workflow.
          required: true
