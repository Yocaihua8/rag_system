name: Docs Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  docs-checks:
    name: Check documentation placeholders and local links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check placeholders
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-placeholders.ps1

      - name: Check local Markdown links
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-doc-links.ps1

      - name: Install runtime dependencies for source-derived contracts
        run: python3 -m pip install -r backend/requirements/base.txt

      - name: Check documentation indexes, metadata, API and schema facts
        run: python3 scripts/check_docs_consistency.py
