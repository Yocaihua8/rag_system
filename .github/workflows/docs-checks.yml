name: Docs Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  docs-checks:
    name: Check documentation placeholders and local links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check placeholders
        shell: pwsh
        run: pwsh -NoProfile -File tools/docs/check-placeholders.ps1

      - name: Check local Markdown links
        shell: pwsh
        run: pwsh -NoProfile -File tools/docs/check-doc-links.ps1

      - name: Check documentation indexes and metadata
        run: python3 tools/docs/check_docs_consistency.py
